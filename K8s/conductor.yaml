apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  labels:
    app.kubernetes.io/name: conductor
    app: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor
        app: conductor
    spec:
      containers:
        - name: conductor
          image: kevinwoo/conducto:3.30.2-conductor-context-src
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 5000
            - name: engine
              containerPort: 8080
          env:
            - name: CONFIG_PROP
              value: config-postgres-conductor.properties
            - name: JAVA_OPTS
              value: -Xms512m -Xmx1536m -Dpolyglot.engine.WarnInterpreterOnly=false
          readinessProbe:
            httpGet:
              path: /conductor/health
              port: ui
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /conductor/health
              port: ui
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  labels:
    app.kubernetes.io/name: conductor
    app: conductor
spec:
  selector:
    app: conductor
  ports:
    - name: ui
      port: 5000
      targetPort: ui
    - name: engine
      port: 8080
      targetPort: engine
