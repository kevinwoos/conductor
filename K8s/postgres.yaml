apiVersion: v1
kind: Service
metadata:
  name: postgresdb
  labels:
    app.kubernetes.io/name: conductor-postgres
    app: conductor-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: conductor-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conductor-postgres
  labels:
    app.kubernetes.io/name: conductor-postgres
    app: conductor-postgres
spec:
  serviceName: postgresdb
  replicas: 1
  selector:
    matchLabels:
      app: conductor-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor-postgres
        app: conductor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: conductor-postgres
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
